spring.application.name=blogplatform-backend
server.port=8080

# =========================================================
#  Datasource - PostgreSQL (primary database)
#
#  One-time setup, run as the "postgres" superuser:
#    CREATE ROLE blog LOGIN PASSWORD 'blog';
#    CREATE DATABASE blogplatform OWNER blog;
#
#  Credentials can be overridden with the DB_USER / DB_PASSWORD
#  environment variables. To run without PostgreSQL at all use
#  the embedded H2 profile:  --spring.profiles.active=h2
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blogplatform}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:blog}
spring.datasource.password=${DB_PASSWORD:blog}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- File uploads (article covers, avatars) ----
app.storage.location=${APP_STORAGE_LOCATION:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================
#  JWT settings (override the secret via APP_JWT_SECRET in prod)
# =========================================================
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-please-change-in-production-0123456789abcdef}
app.jwt.expiration-ms=86400000
