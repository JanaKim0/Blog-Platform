# =========================================================
#  Test profile, activated for every test run by the Surefire
#  configuration in pom.xml.
#
#  It only *overrides* the real application.properties, so anything
#  the application configures - pagination limits, upload limits,
#  security - is exercised by the tests exactly as configured for
#  production rather than being silently replaced.
# =========================================================
spring.datasource.url=jdbc:h2:mem:blogplatform-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Uploads land in the build directory, never in the source tree.
app.storage.location=./target/test-uploads

app.jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef
app.jwt.expiration-ms=3600000
