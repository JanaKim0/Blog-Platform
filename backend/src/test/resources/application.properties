# Tests always run against an in-memory H2 database so that they
# never depend on a local PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:blogplatform-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.storage.location=./target/test-uploads
app.jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:4200
